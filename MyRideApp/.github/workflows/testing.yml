name: MyRideApp Automated Testing

# تحديد متى يعمل هذا الاختبار التلقائي (عند الرفع على فرع main)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب كود المشروع داخل السيرفر الافتراضي
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. إعداد البيئة (مثال: Node.js، استبدلها بـ Java أو Flutter حسب مشروعك)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-node-version: '20'

    # 3. تثبيت المكتبات الاعتمادية للمشروع
    - name: Install dependencies
      run: npm install  # أو flutter pub get حسب مشروعك

    # 4. تشغيل الاختبارات الوظيفية (Functional Tests)
    - name: Run Functional Tests (Unit/Integration)
      run: npm test  # الأمر الذي يشغل الـ Unit Tests في مشروعك

    # 5. تشغيل الاختبارات غير الوظيفية (Non-functional Tests - مثل جودة الكود Linter)
    - name: Run Non-functional Tests (Linting/Format Check)
      run: npm run lint # أو أمر فحص جودة الكود الخاص بمشروعك