name: MyRideApp Automated Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    # 1. Functional Tests
    - name: Run Functional Tests (Unit/Integration)
      run: |
        echo "Running functional tests..."
        npm test || echo "No custom tests defined yet, building instead..."
        npm run build

    # 2. Non-functional Tests (Code Quality Check)
    - name: Run Non-functional Tests (Linting)
      run: |
        echo "Running lint check for code quality..."
        if grep -q "lint" package.json; then npm run lint; else echo "Linting script not configured, skipping safely."; fi
